name: Build Unsigned IPA (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Archive And Package Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Regenerate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf *.xcodeproj
          rm -rf *.xcworkspace
          mise run install
          mise run generate

      - name: Capture short commit SHA
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Archive unsigned app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Piper.xcworkspace \
            -scheme Piper \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Piper.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Piper.xcarchive/Products/Applications/Piper.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "Piper-unsigned-${sha_short}.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Piper-unsigned-${{ env.sha_short }}.ipa
          path: Piper-unsigned-${{ env.sha_short }}.ipa
          if-no-files-found: error

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Unsigned IPA Build"
            echo
            echo "- Regenerated the project from \`Project.swift\`"
            echo "- Archived the app for generic iOS devices without code signing"
            echo "- Packaged \`Piper-unsigned-${sha_short}.ipa\`"
          } >> "$GITHUB_STEP_SUMMARY"
